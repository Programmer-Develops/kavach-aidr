rules:
  # ── Hardcoded Passwords & Keys ─────────────────────────────────────────────

  - id: kavach-hardcoded-password
    patterns:
      - pattern-either:
          - pattern: $KEY = "..."
          - pattern: $KEY = '...'
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i)(password|passwd|pwd|secret|api_key|apikey|private_key|token|passphrase|auth_token|access_token)
      - metavariable-regex:
          metavariable: $KEY
          regex: "^(?!.*TEST|.*EXAMPLE|.*PLACEHOLDER|.*CHANGE_ME).*"
    message: |
      Hardcoded secret detected: '$KEY' contains what appears to be a real
      credential, API key, or password. Store secrets in environment variables
      or a secrets manager (e.g., os.environ['KEY'] or Vault).
    languages: [python]
    severity: ERROR
    metadata:
      cwe: ["CWE-798", "CWE-259"]
      owasp: ["A07:2021"]
      confidence: HIGH
      kavach_priority: CRITICAL

  - id: kavach-hardcoded-token-bearer
    pattern: |
      $VAR = "Bearer ..."
    message: |
      Hardcoded Bearer token found. Tokens must never be embedded in source code.
    languages: [python]
    severity: ERROR
    metadata:
      cwe: ["CWE-798"]
      confidence: HIGH

  - id: kavach-hardcoded-private-key
    pattern: |
      $VAR = "-----BEGIN RSA PRIVATE KEY-----..."
    message: |
      Hardcoded RSA private key detected in source code. This is a CRITICAL
      security violation. Private keys must be stored in HSMs or encrypted
      key stores, never in source code.
    languages: [python]
    severity: ERROR
    metadata:
      cwe: ["CWE-321"]
      confidence: HIGH

  - id: kavach-env-var-recommended
    patterns:
      - pattern: $CONN = sqlite3.connect("...password=..." )
      - pattern: $CONN = psycopg2.connect("...password=...")
    message: |
      Database connection string with hardcoded password. Use environment
      variables: os.environ.get('DB_PASSWORD')
    languages: [python]
    severity: WARNING
    metadata:
      cwe: ["CWE-259"]
      confidence: MEDIUM
